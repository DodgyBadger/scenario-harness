name: package-validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/harness-dist" .
          python -m pip install "$RUNNER_TEMP"/harness-dist/*.whl pytest-asyncio
      - name: Verify installed plugin
        run: python -m pytest tests -q --basetemp "$RUNNER_TEMP/harness-tests"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-checks
          path: ${{ runner.temp }}/harness-tests
          if-no-files-found: warn
